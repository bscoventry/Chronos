##############################################################################
# BLE ON/OFF — set to n for RTC-only low-power stim (no radio)
##############################################################################
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Chronos"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_NUS=y
#CONFIG_BT_NUS_SECURITY_ENABLED=n

##############################################################################
# Peripherals: GPIO, SPIM1, TIMER0 (burst), TIMER2 (period)
##############################################################################
#CONFIG_NRFX=y
CONFIG_DEVICE_DT_METADATA=n
CONFIG_DEVICE_DEPS=n
CONFIG_NRFX_SPIM=y
CONFIG_NRFX_TIMER=y
CONFIG_NRFX_SAADC=y
CONFIG_NRFX_GPPI=y
CONFIG_GPIO=y

##############################################################################
# AD5933 / impedance (Phase A: I2C22 + P0.05 switch GPIO)
##############################################################################
CONFIG_CHRONOS_ZMEAS=y
CONFIG_CHRONOS_ZMEAS_SWITCH_ACTIVE_HIGH=y
CONFIG_I2C=y
#CONFIG_SPI=y
#CONFIG_NRFX_SPIM00=y
CONFIG_NRFX_QSPI=n
# TIMER: nRF54L15 uses TIMER20, TIMER22 etc. (enable per-instance in overlay if needed)
#CONFIG_NRFX_TIMER0=y
#CONFIG_NRFX_TIMER1=y

##############################################################################
# DK LEDs — off on custom (P1.10 = SPI MOSI; no DK LED routing)
##############################################################################
CONFIG_DK_LIBRARY=n

##############################################################################
# Heap / stacks (BLE needs more than RTC-only)
##############################################################################
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_BT_RX_STACK_SIZE=2048

##############################################################################
# UART / serial (NUS bridge on uart00; console is RTT, not UART)
# NUS sample path expects async UART; enables CONFIG_BT_NUS_UART_* sizes in Kconfig.
##############################################################################
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y

##############################################################################
# Console / log / debug (RTT via J-Link SWD — no UART console on custom board)
##############################################################################
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_DEBUG_THREAD_INFO=n
CONFIG_ASSERT=n

##############################################################################
# Boot / size
##############################################################################
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n
CONFIG_SIZE_OPTIMIZATIONS=y

##############################################################################
# Power management (System OFF, deferred session HW, PM_DEVICE for suspend)
# Note: CONFIG_PM idle is not available on nRF54L15 cpuapp (no HAS_PM).
##############################################################################
CONFIG_CHRONOS_DEFER_SESSION_HW_INIT=y
CONFIG_CHRONOS_MINIMAL_BOOT=y

##############################################################################
# BLE connection interval preference. 15-30 ms instead of 30-50 ms: 25 kHz eCAP
# streaming needs ~50 kB/s, and centrals that cap packets per connection event
# cannot reach that at long intervals. Latency 2 still lets idle links skip events.
##############################################################################
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24
CONFIG_BT_PERIPHERAL_PREF_LATENCY=2

##############################################################################
# BLE throughput for 25 kHz ADC streaming (242-byte NUS sample packets).
# 251-byte LL payloads (data length extension, auto-initiated) and a 247-byte
# ATT MTU; 2M PHY is already auto-requested (CONFIG_BT_AUTO_PHY_UPDATE).
# ACL TX count also sizes the ATT and L2CAP TX pools, so more notifications
# can be queued per connection event. The host requires more HCI event
# buffers than ACL TX buffers (one completion event per queued packet).
##############################################################################
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_BUF_EVT_RX_COUNT=12

##############################################################################
# Release overlay: west build -- -DCHRONOS_RELEASE=1  (disables RTT/log)
# No-BLE A/B: add prj_no_ble.conf in nRF Connect Kconfig fragments, or:
#   west build ... -- -DCHRONOS_NO_BLE=1
##############################################################################

##############################################################################
# Stim NVM — set n to disable flash persistence and boot-time stim resume
# (useful for idle-current debug).
##############################################################################
CONFIG_CHRONOS_SYSTEM_OFF=y
CONFIG_CHRONOS_STIM_NVM=n

##############################################################################
# Flash. When CONFIG_CHRONOS_STIM_NVM=y, also uncomment the block below.
##############################################################################
CONFIG_FLASH=y
CONFIG_SPI_NOR=n
# CONFIG_FLASH_MAP=y
# CONFIG_FLASH_PAGE_LAYOUT=y
# CONFIG_NVS=y
# CONFIG_SETTINGS=y
# CONFIG_SETTINGS_NVS=y
